@if (visible()) {
  <div
    class="fixed inset-0 bg-ink/70 flex items-center justify-center z-[60] backdrop-blur-md px-2 sm:px-4 animate-fade-in"
    (click)="closeModal()"
  >
    <div
      [ngClass]="[getModalSizeClass(), getModalHeightClass()]"
      class="bg-white rounded-md shadow-2xl custom-scrollbar overflow-y-auto ring-1 ring-slate-200"
      (click)="$event.stopPropagation()"
    >
      <div
        class="px-5 sm:px-7 py-4 sm:py-5 bg-white/95 backdrop-blur border-b border-slate-200 flex justify-between items-center sticky top-0 z-10"
      >
        <h3
          class="text-base sm:text-lg text-ink font-bold tracking-tight"
        >
          {{ title() }}
        </h3>
        <button
          (click)="closeModal()"
          class="text-slate-500 hover:text-ink transition-colors duration-200 p-2 rounded-[3px] hover:bg-slate-100 flex-shrink-0 ml-2"
        >
          <svg
            class="h-5 w-5 sm:h-6 sm:w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <div class="p-3 sm:p-6">
        <div
          class="custom-scroll"
          [style.max-height]="getContentMaxHeight()"
          style="overflow-y: auto"
        >
          <div class="flex flex-col space-y-6">
            <ng-container #dynamicContent></ng-container>
          </div>
        </div>
      </div>
      @if (currentConfig()?.showButtons !== false) {
        <div
          class="px-5 sm:px-7 py-4 bg-slate-50 border-t border-slate-200"
        >
          <div class="flex justify-end gap-3">
            <button
              (click)="closeModal()"
              [disabled]="isProcessing()"
              class="btn-outline w-full sm:w-auto"
            >
              {{ "modal.buttons.cancel" | transloco }}
            </button>
            <button
              (click)="onAccept()"
              [disabled]="isProcessing()"
              class="btn-primary w-full sm:w-auto"
            >
              @if (!isLoading()) {
                <span>{{ "modal.buttons.acept" | transloco }}</span>
              }
              @if (isLoading()) {
                <div class="flex items-center">
                  <svg
                    class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
                    fill="none"
                    viewBox="0 0 24 24"
                  >
                    <circle
                      class="opacity-25"
                      cx="12"
                      cy="12"
                      r="10"
                      stroke="currentColor"
                      stroke-width="4"
                    ></circle>
                    <path
                      class="opacity-75"
                      fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                    ></path>
                  </svg>
                  {{ "modal.buttons.acept" | transloco }}
                </div>
              }
            </button>
          </div>
        </div>
      }
    </div>
  </div>
}
<style>
  .custom-scroll::-webkit-scrollbar {
    width: 8px;
  }
  .custom-scroll::-webkit-scrollbar-track {
    background-color: transparent;
  }
  .custom-scroll::-webkit-scrollbar-thumb {
    background-color: #c8bff3;
    border-radius: 10px;
  }
  .custom-scroll::-webkit-scrollbar-thumb:hover {
    background-color: #7d70c9;
  }
  /* Para Firefox */
  .custom-scroll {
    scrollbar-width: thin;
    scrollbar-color: #c8bff3 transparent;
  }
</style>
